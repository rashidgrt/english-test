<style>
:root{--bg:#eef6f5;--card:#fff;--ink:#14292b;--mut:#5b7173;--line:#cfe0de;--pri:#0f7b7b;--acc:#d9603b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,#0a4d57,#139a8f);color:#fff;padding:20px 16px 18px;border-bottom:4px solid var(--acc)}
.wrap{max-width:1100px;margin:auto}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h1{margin:0;font-size:1.4rem}.sub{opacity:.92;font-size:.85rem;margin-top:3px}.who{opacity:.88;font-size:.78rem;margin-top:8px}
.tbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.5rem;color:var(--pri)}.stat span{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
h2{font-size:1.05rem;margin:18px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cls{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cls .n{font-size:1.25rem;font-weight:700}.cls .m{color:var(--mut);font-size:.82rem}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:9px 12px;text-decoration:none;text-align:center;font-weight:600;margin-top:auto}
.btn:hover{background:var(--acc)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
@media(max-width:560px){.filters{grid-template-columns:1fr}}
.filters input,.filters select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;font:inherit}
.res{margin:10px 0 30px;display:grid;gap:6px}
.row{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.row:hover{border-color:var(--acc)}.row .w{font-size:.74rem;color:var(--mut)}.row .t{font-weight:600}
.cnt{color:var(--mut);font-size:.85rem;margin-top:8px}
</style></head><body>
